name: Release APK

# Builds the Android debug APK and publishes it to a GitHub Release whenever the `release`
# branch is updated (or when triggered manually). The debug APK is installable without signing
# keys, which keeps the pipeline self-contained.
on:
  push:
    branches: [release]
  workflow_dispatch:

# Needed for softprops/action-gh-release to create the release + upload assets.
permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read version name
        id: ver
        run: |
          name=$(grep -m1 versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prm-tool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ github.run_number }}
          name: PRM Tool v${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
